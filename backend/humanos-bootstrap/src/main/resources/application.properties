spring:
  application:
    name: HumanOS

spring.datasource.url=jdbc:postgresql://localhost:5432/humanos

spring.datasource.username=humanos

spring.datasource.password=humanos_password

spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true